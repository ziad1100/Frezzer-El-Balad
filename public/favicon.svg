<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dark navy circle background -->
  <circle cx="50" cy="50" r="48" fill="#0F172A" />
  
  <!-- Blue snowflake icon -->
  <g transform="translate(50,50)" stroke="#38BDF8" stroke-width="3" stroke-linecap="round">
    <!-- 6 main arms -->
    <line x1="0" y1="-22" x2="0" y2="22" />
    <line x1="-19" y1="-11" x2="19" y2="11" />
    <line x1="-19" y1="11" x2="19" y2="-11" />
    <!-- Top arm tips -->
    <line x1="-5" y1="-19" x2="0" y2="-24" />
    <line x1="5" y1="-19" x2="0" y2="-24" />
    <!-- Bottom arm tips -->
    <line x1="-5" y1="19" x2="0" y2="24" />
    <line x1="5" y1="19" x2="0" y2="24" />
    <!-- Top-left arm tips -->
    <line x1="-22" y1="-8" x2="-24" y2="-5" />
    <line x1="-20" y1="-5" x2="-24" y2="-5" />
    <!-- Top-right arm tips -->
    <line x1="22" y1="-8" x2="24" y2="-5" />
    <line x1="20" y1="-5" x2="24" y2="-5" />
    <!-- Bottom-left arm tips -->
    <line x1="-22" y1="8" x2="-24" y2="5" />
    <line x1="-20" y1="5" x2="-24" y2="5" />
    <!-- Bottom-right arm tips -->
    <line x1="22" y1="8" x2="24" y2="5" />
    <line x1="20" y1="5" x2="24" y2="5" />
    <!-- Center diamond accent -->
    <circle cx="0" cy="0" r="3" fill="#38BDF8" />
  </g>
</svg>
