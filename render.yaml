# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — Frezzer El Balad production backend (FREE TIER ONLY)
#
# Architecture:
#   • Vercel Free   → frontend (frezzer-el-balad.vercel.app)
#   • Render Free   → API Web Service (Express + Node via Dockerfile)
#   • Database      → managed PostgreSQL (DATABASE_URL secret in Render)
#
# NO paid resources defined — no Redis, no background worker.
# The application is fully functional without Redis.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: frezzer-el-balad-api
    runtime: docker
    repo: https://github.com/ziad1100/Frezzer-El-Balad
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: PG_MAX_POOL_SIZE
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_REGISTER_CODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false
